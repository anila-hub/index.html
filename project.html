<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #e8f0fe;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.profile-card {
    width: 350px;
    background: white;
    text-align: center;

    padding: 30px;
    border-radius: 20px;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
}

.profile-card img {
    width: 130px;
    height: 130px;

    border-radius: 50%;
    object-fit: cover;

    border: 4px solid #4f7cff;
}

.profile-card h1 {
    margin-top: 15px;
    font-size: 28px;
}

.profile-card h3 {
    margin-top: 8px;
    color: #4f7cff;
}

.profile-card p {
    margin-top: 15px;
    line-height: 1.6;
    color: #555;
}

.buttons {
    margin-top: 20px;
}

.buttons a {
    display: inline-block;

    text-decoration: none;
    background: #4f7cff;
    color: white;

    padding: 10px 18px;
    margin: 5px;

    border-radius: 8px;
}

.buttons a:hover {
    background: #244fc4;
}

    </style>
</head>
<body>
    <div class="profile-card">

        <img src="profile.jpg" alt="Profile Picture">

        <h1>Anila</h1>

        <h3>Web Development Student</h3>

        <p>
            Hello! I am learning HTML and CSS.
            I enjoy creating simple and beautiful websites.
        </p>

        <div class="buttons">
            <a href="#">Instagram</a>
            <a href="#">GitHub</a>
        </div>

    </div>
    
</body>
</html>
