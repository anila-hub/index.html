<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.slider {
    width: 900px;
    height: 550px;
    overflow: hidden;
}

.slides {
    display: flex;
    width: 2700px;

    animation: slide 12s infinite;
}

.movie {
    width: 900px;
    height: 550px;
    position: relative;
    flex-shrink: 0;
}

.movie img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.text {
    position: absolute;
    left: 50px;
    bottom: 60px;
    color: white;
    width: 400px;
}

.text h1 {
    font-size: 45px;
    margin-bottom: 15px;
}

.text p {
    font-size: 18px;
    line-height: 1.5;
}


/* Sliding animation */

@keyframes slide {

    0% {
        transform: translateX(0);
    }

    30% {
        transform: translateX(0);
    }

    35% {
        transform: translateX(-900px);
    }

    65% {
        transform: translateX(-900px);
    }

    70% {
        transform: translateX(-1800px);
    }

    95% {
        transform: translateX(-1800px);
    }

    100% {
        transform: translateX(0);
    }
}

    </style>
</head>
<body>
    <div class="slider">

        <div class="slides">

            <div class="movie">
                <img src="./spidy.jpg" alt="Spider-Man">
                <div class="text">
                    <h1>SPIDER-MAN</h1>
                    <p>Spider-Man faces a brand-new challenge while protecting the city.</p>
                </div>
            </div>

            <div class="movie">
                <img src="./Raya.webp" alt="Raya">
                <div class="text">
                    <h1>RAYA</h1>
                    <p>A brave warrior sets out on a journey to save her world.</p>
                </div>
            </div>

            <div class="movie">
                <img src="./avengers.jpg" alt="Avengers">
                <div class="text">
                    <h1>AVENGERS</h1>
                    <p>Earth's greatest heroes come together to face a powerful enemy.</p>
                </div>
            </div>

        </div>

    </div>
    
</body>
</html>
