<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        #parent{
            background-image: url(./bg.jpg);
            background-repeat: no-repeat ;
            background-size: cover;
            height: 600px;
            border: 2px solid black;
            display :flex;
            justify-content: space-evenly;
            align-items: center;
            border-radius: 20px;

        }
        #child1,#child2,#child3{
            height: 200px;
            width: 200px;
            border-radius: 20px;
            overflow:hidden;
            
        }
      
        img:hover{
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="child1"><img src="./avengers.jpg"  height="200px" width="200px"></div>
        <div id="child2"><img src="./Raya.webp" height="200px" width="200px"></div>
        <div id="child3"><img src="./spidy.jpg" height="200px" width="200px"></div>
    </div>
</body>
</html>
